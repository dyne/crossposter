name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run test:boundaries
      - run: npm run test:unit
      - run: npm run test:coverage
      - run: npm run test:browser-verification
      - run: npm --prefix web run test:worker
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p output/ci
      - name: Control production runtime
        timeout-minutes: 5
        run: npm run test:control-runtime > output/ci/control-runtime.log 2>&1
      - run: npm run test:e2e
      - name: MCP protocol and lifecycle
        timeout-minutes: 5
        run: npm run test:mcp > output/ci/mcp.log 2>&1
      - name: Actual npm package build and runtime
        timeout-minutes: 5
        run: npm run test:mcp-package > output/ci/mcp-package.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage/
            test-results/
            output/ci/
            output/playwright/
          retention-days: 7
